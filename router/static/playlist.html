<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的歌单</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      /* 我的歌单：两栏用 float 分栏（最老的写法，iOS 7 / IE8 都认），
         列表项用绝对定位放封面，不依赖 flex / object-fit / gap */
      .main-container {
        max-width: none;
        width: 100%;
        min-height: 100vh;
        padding: 16px;
      }
      .music-shell {
        overflow: hidden;
      }
      .library-panel {
        float: left;
        width: 37%;
        padding: 12px;
        background: #ffffff;
        border: 1px solid #e3e5ea;
        border-radius: 14px;
        -webkit-border-radius: 14px;
      }
      .detail-panel {
        float: left;
        width: 61%;
        margin-left: 2%;
        padding: 14px;
        background: #ffffff;
        border: 1px solid #e3e5ea;
        border-radius: 14px;
        -webkit-border-radius: 14px;
      }
      /* 标题栏：图片左浮，标题跟上，返回右浮 */
      .panel-heading {
        overflow: hidden;
        margin-bottom: 10px;
      }
      .panel-heading img {
        float: left;
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #e9ebf1;
      }
      .panel-heading h2 {
        float: left;
        margin: 4px 0 0 8px;
        font-size: 19px;
        font-weight: 600;
        color: #111418;
      }
      .panel-heading a {
        float: right;
        font-size: 16px;
        line-height: 28px;
      }
      #message {
        margin: 0 0 10px;
        font-size: 15px;
        line-height: 1.6;
        color: #6b7280;
        white-space: pre-line;
        word-wrap: break-word;
      }
      /* 账号栏 */
      .account {
        overflow: hidden;
        margin-bottom: 12px;
        padding: 10px;
        background: #f6f7fa;
        border-radius: 10px;
        -webkit-border-radius: 10px;
      }
      #accountLabel {
        float: left;
        max-width: 55%;
        font-size: 15px;
        line-height: 32px;
        color: #4b5563;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #loginButton {
        float: right;
        padding: 7px 14px;
        font-size: 15px;
      }
      #cookieEditor {
        clear: both;
        padding-top: 8px;
      }
      #cookieInput {
        margin: 0 0 8px;
        font-family: monospace;
      }
      .account-actions {
        overflow: hidden;
      }
      .account-actions button {
        display: inline-block;
        margin: 0 6px 0 0;
        padding: 8px 12px;
        font-size: 15px;
      }
      .muted {
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.6;
        color: #8a919e;
      }
      /* 歌单列表 */
      .playlist-list {
        -webkit-overflow-scrolling: touch;
      }
      .playlist-item {
        display: block;
        position: relative;
        width: 100%;
        min-height: 68px;
        margin: 0 0 2px;
        padding: 8px 10px 8px 68px;
        border: 0;
        border-radius: 10px;
        -webkit-border-radius: 10px;
        background: transparent;
        color: #111418;
        text-align: left;
        cursor: pointer;
      }
      .playlist-item:hover,
      .playlist-item.active {
        background: #e9f5fd;
      }
      .playlist-item img {
        position: absolute;
        left: 8px;
        top: 50%;
        margin-top: -26px;
        width: 52px;
        height: 52px;
        border-radius: 8px;
        -webkit-border-radius: 8px;
        background: #eef0f4;
      }
      .playlist-meta {
        display: block;
        padding-top: 4px;
      }
      .playlist-name,
      .playlist-count,
      .track-name,
      .track-artists {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .playlist-name {
        font-size: 16px;
        font-weight: 500;
        line-height: 1.4;
        color: #111418;
      }
      .playlist-count {
        font-size: 14px;
        line-height: 1.5;
        color: #8a919e;
      }
      /* 详情头部：封面左浮 */
      .detail-header {
        overflow: hidden;
        margin-bottom: 14px;
      }
      .detail-cover {
        float: left;
        display: block;
        width: 100px;
        height: 100px;
        margin-right: 14px;
        border-radius: 10px;
        -webkit-border-radius: 10px;
        background: #eef0f4;
      }
      .detail-title {
        overflow: hidden;
      }
      .detail-title h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 600;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail-title p {
        margin: 0 0 6px;
        font-size: 15px;
        color: #8a919e;
      }
      #playAll {
        padding: 8px 16px;
        font-size: 15px;
      }
      .back-button {
        display: none;
        margin: 0 0 12px;
        padding: 8px 14px;
        font-size: 15px;
      }
      /* 歌曲列表：序号/标记左浮，信息区 BFC 吃掉剩余宽度 */
      .track-row {
        overflow: hidden;
        padding: 9px 2px;
        border-top: 1px solid #eef0f4;
        cursor: pointer;
      }
      .track-row:first-child {
        border-top: 0;
      }
      .track-row:hover {
        background: #f6f8fc;
      }
      .playing-mark {
        float: left;
        width: 18px;
        font-size: 13px;
        line-height: 1.9;
        color: #3498db;
        visibility: hidden;
      }
      .track-row.playing .playing-mark {
        visibility: visible;
      }
      .track-index {
        float: left;
        width: 30px;
        font-size: 14px;
        line-height: 1.75;
        color: #8a919e;
        text-align: right;
      }
      .track-info {
        /* 必须是块级，overflow 对 inline 元素无效，否则整块会被挤到序号下面 */
        display: block;
        overflow: hidden;
        padding-left: 8px;
      }
      .track-name {
        font-size: 16px;
        line-height: 1.4;
        color: #111418;
      }
      .track-artists {
        font-size: 14px;
        line-height: 1.5;
        color: #8a919e;
      }
      .empty-state {
        padding: 28px 10px;
        font-size: 15px;
        text-align: center;
        color: #8a919e;
      }
      [hidden] {
        display: none !important;
      }
      /* 窄屏：两栏收成一栏，靠 JS 切 .mobile-hidden 翻页 */
      @media (max-width: 650px) {
        .main-container {
          padding: 12px 10px 28px;
        }
        .library-panel,
        .detail-panel {
          float: none;
          width: auto;
          margin: 0 0 12px;
        }
        .detail-panel.mobile-hidden,
        .library-panel.mobile-hidden {
          display: none;
        }
        .back-button {
          display: inline-block;
        }
        .detail-cover {
          width: 76px;
          height: 76px;
          margin-right: 12px;
        }
        .detail-title h1 {
          font-size: 20px;
        }
      }
      @media (prefers-color-scheme: dark) {
        .library-panel,
        .detail-panel {
          background: #1a1d23;
          border-color: #2b2f37;
        }
        .account {
          background: #14171c;
        }
        #accountLabel,
        .playlist-item,
        .playlist-name,
        .track-name,
        .detail-title h1,
        .panel-heading h2 {
          color: #e9eaee;
        }
        .playlist-count,
        .track-artists,
        .track-index,
        .detail-title p,
        #message,
        .empty-state,
        .muted {
          color: #9aa1ad;
        }
        .panel-heading img,
        .playlist-item img,
        .detail-cover {
          background: #22262e;
        }
        .playlist-item:hover,
        .playlist-item.active {
          background: #1e2a44;
        }
        .track-row {
          border-top-color: #2b2f37;
        }
        .track-row:hover {
          background: #20242b;
        }
        #cookieInput {
          background: #14171c;
          border-color: #333945;
          color: #e9eaee;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="music-shell">
        <aside class="library-panel" id="libraryPanel">
          <div class="panel-heading">
            <img src="/favicon.ico" />
            <h2>我的歌单</h2>
            <a href="/">返回</a>
          </div>
          <div id="message" role="status">正在读取播放状态……</div>
          <div class="account">
            <div id="accountLabel">未登录</div>
            <div id="cookieEditor" hidden>
              <input
                id="cookieInput"
                type="password"
                placeholder="粘贴当前平台的完整 Cookie"
              />
              <div class="account-actions">
                <button type="button" id="saveCookie">保存并登录</button><button type="button" id="qrLoginBtn" hidden>扫码登录</button
                ><button type="button" class="red" id="clearCookie">清除</button>
              </div>
              <div class="muted" id="cookieHint"></div>
            </div>
            <button type="button" id="loginButton">登录</button>
          </div>
          <div class="playlist-list" id="playlistList">
            <div class="empty-state">正在加载歌单……</div>
          </div>
        </aside>
        <main class="detail-panel mobile-hidden" id="detailPanel">
          <button type="button" class="back-button" id="backButton">
            返回歌单
          </button>
          <div id="detailEmpty" class="empty-state">请选择一个歌单</div>
          <div id="detailContent" hidden>
            <div class="detail-header">
              <img class="detail-cover" id="detailCover" alt="" />
              <div class="detail-title">
                <h1 id="detailName"></h1>
                <p id="detailId"></p>
                <p id="detailCount"></p>
                <button type="button" id="playAll">播放全部</button>
              </div>
            </div>
            <div class="track-list" id="trackList"></div>
          </div>
        </main>
      </div>
    </div>
    <script>
      // 三个平台只在取数接口和字段上不同，统一归一化成同一形状后渲染逻辑不用分支
      var SOURCES = {
        netease: {
          label: "网易云音乐",
          daily: true,
          cookieHint: "先登录网页版music.163.com，按F12打开开发者工具，切换到\"网络\"标签，刷新页面，点击第一个请求，找到\"请求标头\"中的\"Cookie\"，右键\"复制值\"粘贴到上方输入框",
          userInfo: function (done, failed) {
            json("/neapi/user/info", function (u) {
              if (!u || u.code === 301 || !u.userPoint || !u.userPoint.userId) {
                failed();
                return;
              }
              done(String(u.userPoint.userId));
            }, failed);
          },
          userPlaylists: function (uid, done, failed) {
            json("/neapi/user/playlist?limit=99999&uid=" + encodeURIComponent(uid), function (d) {
              var list = (d && d.playlist) || [];
              var nickname = "";
              var i;
              for (i = 0; i < list.length; i++) {
                if (list[i] && list[i].creator && list[i].creator.nickname) {
                  nickname = list[i].creator.nickname;
                  break;
                }
              }
              done(list, nickname);
            }, failed);
          },
          playlistDetail: function (id, done, failed) {
            json("/neapi/v6/playlist/detail?n=99999&id=" + encodeURIComponent(id), function (d) {
              if (!d || d.code !== 200 || !d.playlist) {
                failed(new Error((d && (d.message || d.msg)) || "歌单接口返回错误"));
                return;
              }
              var pl = d.playlist;
              var tracks = pl.tracks || [];
              done({
                id: String(id),
                name: pl.name || "未命名歌单",
                coverImgUrl: pl.coverImgUrl || "",
                trackCount: pl.trackCount || tracks.length,
                tracks: normalizeNetease(tracks)
              });
            }, failed);
          },
          daily: function (done, failed) {
            json("/neapi/v2/discovery/recommend/songs?t=" + new Date().getTime(), function (d) {
              if (!d || d.code !== 200 || !d.recommend) {
                failed(new Error((d && (d.message || d.msg)) || "每日推荐接口返回错误，请检查登录状态"));
                return;
              }
              done({
                id: "daily-recommend",
                name: "每日推荐",
                coverImgUrl: "/favicon.ico",
                trackCount: d.recommend.length,
                tracks: normalizeNetease(d.recommend)
              });
            }, failed);
          }
        },
        qq: {
          label: "QQ音乐",
          daily: false,
          cookieHint: "先登录网页版y.qq.com，按F12打开开发者工具，切换到\"网络\"标签，刷新页面，点击第一个请求，找到\"请求标头\"中的\"Cookie\"，右键\"复制值\"粘贴到上方输入框",
          userInfo: function (done, failed) {
            json("/qqapi/user/info", function (u) {
              if (!u || u.code !== 200 || !u.data || !u.data.uin) {
                failed();
                return;
              }
              done(String(u.data.uin));
            }, failed);
          },
          userPlaylists: function (uid, done, failed) {
            json("/qqapi/user/playlist?uin=" + encodeURIComponent(uid), function (d) {
              if (d && d.error) {
                failed(new Error(d.error));
                return;
              }
              var req = (d && d.req_0) || {};
              var data = req.data || {};
              // 接口有两种形状，字段名也各不相同，这里一起兼容
              var raw = data.v_playlist || data.playlist || [];
              var list = [];
              var nickname = "";
              var i;
              var item;
              var id;
              var name;
              var cover;
              var count;
              if (!raw.length) {
                var code = req.code != null ? req.code : d && d.code;
                if (code) {
                  failed(
                    new Error(
                      "QQ音乐返回错误 code=" +
                        code +
                        " " +
                        (req.message || (d && d.message) || "")
                    )
                  );
                  return;
                }
              }
              for (i = 0; i < raw.length; i++) {
                item = raw[i];
                if (!item) continue;
                // dirShow/dir_show 为 0 的是隐藏目录，不用展示
                if (item.dirShow === 0 || item.dir_show === 0) continue;
                // 用户歌单用 tid（就是 disstid），特殊目录只有 dirid
                if (item.dissid != null && item.dissid !== 0) id = item.dissid;
                else if (item.tid != null && item.tid !== 0) id = item.tid;
                else id = item.dirid;
                if (id == null || id === 0) continue;
                name = item.dissname || item.diss_name || item.dirName || "未命名歌单";
                cover =
                  item.logo || item.diss_cover || item.picUrl || item.bigpicUrl || "";
                count = item.song_cnt || item.songNum || 0;
                if (!nickname) nickname = item.nickname || item.nick || "";
                list.push({
                  id: String(id),
                  name: name,
                  coverImgUrl: cover,
                  trackCount: count
                });
              }
              done(list, nickname);
            }, failed);
          },
          playlistDetail: function (id, done, failed) {
            json("/qqapi/playlist/detail?id=" + encodeURIComponent(id), function (d) {
              if (!d || !d.cdlist || !d.cdlist.length) {
                failed(new Error("歌单不存在或没有权限，请检查id和登录状态"));
                return;
              }
              var cd = d.cdlist[0];
              var songs = cd.songlist || [];
              done({
                id: String(id),
                name: cd.dissname || "未命名歌单",
                coverImgUrl: cd.logo || "",
                trackCount: cd.songnum || songs.length,
                tracks: normalizeQQ(songs)
              });
            }, failed);
          }
        },
        kugou: {
          label: "酷狗音乐",
          daily: false,
          cookieHint: "酷狗音乐比较抽象，只能扫码登录",
          userInfo: function (done, failed) {
            json("/kgapi/user/info", function (u) {
              if (!u || u.status !== 1 || !u.data || !u.data.userid) {
                failed();
                return;
              }
              done(String(u.data.userid));
            }, failed);
          },
          userPlaylists: function (uid, done, failed) {
            json("/kgapi/user/playlist?userid=" + encodeURIComponent(uid), function (d) {
              var raw = (d && d.data && d.data.info) || [];
              var list = [];
              var i;
              var item;
              for (i = 0; i < raw.length; i++) {
                item = raw[i];
                if (!item || item.specialid == null) continue;
                list.push({
                  id: String(item.specialid),
                  name: item.specialname || "未命名歌单",
                  coverImgUrl: fixKugouImg(item.imgurl),
                  trackCount: item.songcount || 0
                });
              }
              done(list, "");
            }, failed);
          },
          playlistDetail: function (id, done, failed) {
            json("/kgapi/special/detail?id=" + encodeURIComponent(id), function (info) {
              var d = (info && info.data) || {};
              json("/kgapi/special/song?id=" + encodeURIComponent(id), function (songs) {
                var raw = (songs && songs.data && songs.data.info) || [];
                done({
                  id: String(id),
                  // 酷狗详情没有名字，返回空，交给 select() 保留列表里已有的名称
                  name: d.specialname || "",
                  coverImgUrl: fixKugouImg(d.imgurl),
                  trackCount: d.songcount || raw.length,
                  tracks: normalizeKugou(raw)
                });
              }, failed);
            }, failed);
          }
        }
      };
      var DAILY_ID = "daily-recommend";

      var state = {
        api: "netease",
        playlists: [],
        currentId: "",
        nowId: "",
        selected: null,
        trackIds: [],
        details: {}
      };
      var defPlayListId = "";
      var nePlayListId = "";
      var playingListId = "";
      var statusRefreshing = false;
      var loggedIn = false;
      var detailWaiters = {};

      function $(id) {
        return document.getElementById(id);
      }
      function msg(t, e) {
        $("message").textContent = t;
        $("message").style.color = e ? "#c0392b" : "";
      }
      function source() {
        return SOURCES[state.api] || SOURCES.netease;
      }
      function request(url, done, failed) {
        var xhr;
        var finished = false;
        failed = failed || function () {};
        function fail(error) {
          if (finished) return;
          finished = true;
          failed(error);
        }
        try {
          xhr = window.XMLHttpRequest
            ? new XMLHttpRequest()
            : new ActiveXObject("Microsoft.XMLHTTP");
          xhr.onreadystatechange = function () {
            var status;
            if (xhr.readyState !== 4 || finished) return;
            status = xhr.status === 1223 ? 204 : xhr.status;
            if (status >= 200 && status < 300) {
              finished = true;
              done(xhr.responseText);
            } else {
              // 后端会把上游错误写在 error 字段里，直接显示出来
              fail(new Error(errorText(xhr.responseText) || "HTTP " + status));
            }
          };
          xhr.onerror = function () {
            fail(new Error("网络请求失败"));
          };
          xhr.open("GET", url, true);
          xhr.send(null);
        } catch (e) {
          fail(e);
        }
      }
      // errorText 取后端错误响应里的 error 字段，取不到返回空串
      function errorText(text) {
        var data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          return "";
        }
        return data && data.error ? String(data.error) : "";
      }
      function postForm(url, body, done, failed) {
        var xhr;
        failed = failed || function () {};
        try {
          xhr = window.XMLHttpRequest
            ? new XMLHttpRequest()
            : new ActiveXObject("Microsoft.XMLHTTP");
          xhr.onreadystatechange = function () {
            var status;
            if (xhr.readyState !== 4) return;
            status = xhr.status === 1223 ? 204 : xhr.status;
            if (status >= 200 && status < 300) {
              done(xhr.responseText);
            } else {
              failed(new Error("HTTP " + status));
            }
          };
          xhr.onerror = function () {
            failed(new Error("网络请求失败"));
          };
          xhr.open("POST", url, true);
          xhr.setRequestHeader(
            "Content-Type",
            "application/x-www-form-urlencoded"
          );
          xhr.send(body);
        } catch (e) {
          failed(e);
        }
      }
      function json(url, done, failed) {
        request(
          url,
          function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              if (failed) failed(e);
              return;
            }
            done(data);
          },
          failed
        );
      }
      function image(i, u) {
        i.onerror = function () {
          i.removeAttribute("src");
        };
        if (u) i.src = u;
      }
      function setHidden(element, hidden) {
        element.hidden = hidden;
        element.style.display = hidden ? "none" : "";
      }
      function addClass(element, name) {
        if ((" " + element.className + " ").indexOf(" " + name + " ") < 0) {
          element.className += (element.className ? " " : "") + name;
        }
      }
      function removeClass(element, name) {
        var classes = element.className.split(" ");
        var kept = [];
        var i;
        for (i = 0; i < classes.length; i++) {
          if (classes[i] && classes[i] !== name) kept.push(classes[i]);
        }
        element.className = kept.join(" ");
      }
      function toggleClass(element, name, enabled) {
        if (enabled) addClass(element, name);
        else removeClass(element, name);
      }
      // 各平台字段名不一样，统一成 {id,name,artists}
      function fixKugouImg(u) {
        if (!u) return "";
        return String(u).replace("{size}", "400");
      }
      function artistNames(list) {
        var out = [];
        var i;
        if (!list) return out;
        for (i = 0; i < list.length; i++) {
          if (list[i] && list[i].name) out.push(list[i].name);
        }
        return out;
      }
      function normalizeNetease(ts) {
        var out = [];
        var i;
        var t;
        for (i = 0; i < ts.length; i++) {
          t = ts[i];
          if (!t || t.id == null) continue;
          out.push({
            id: String(t.id),
            name: t.name || "未知歌曲",
            artists: artistNames(t.ar || t.artists).join(" / ") || "未知歌手"
          });
        }
        return out;
      }
      function normalizeQQ(ts) {
        var out = [];
        var i;
        var t;
        for (i = 0; i < ts.length; i++) {
          t = ts[i];
          if (!t || !t.songmid) continue;
          out.push({
            id: String(t.songmid),
            name: t.songname || t.name || "未知歌曲",
            artists: artistNames(t.singer).join(" / ") || "未知歌手"
          });
        }
        return out;
      }
      function kugouSongID(hash, albumID) {
        if (!hash) return "";
        if (!albumID || Number(albumID) <= 0) return String(hash);
        // 酷狗播放要 hash + album_id，拼一起传回后端
        return String(hash) + "_" + String(albumID);
      }
      function normalizeKugou(ts) {
        var out = [];
        var i;
        var t;
        var name;
        var artists;
        var sep;
        for (i = 0; i < ts.length; i++) {
          t = ts[i];
          if (!t || !t.hash) continue;
          name = t.filename || t.songname || "未知歌曲";
          artists = "";
          // 酷狗返回的 filename 一般是 "歌手 - 歌名"
          sep = name.indexOf(" - ");
          if (sep > 0) {
            artists = name.substring(0, sep);
            name = name.substring(sep + 3);
          }
          out.push({
            id: kugouSongID(t.hash, t.album_id),
            name: name,
            artists: artists || "未知歌手"
          });
        }
        return out;
      }
      function getHistory() {
        try {
          var h = localStorage.getItem("playlist_history_" + state.api);
          return h ? JSON.parse(h) : [];
        } catch (e) {
          return [];
        }
      }
      function addHistory(id) {
        try {
          var h = getHistory();
          var index = -1;
          var i;
          for (i = 0; i < h.length; i++) {
            if (h[i] === id) {
              index = i;
              break;
            }
          }
          if (index >= 0) h.splice(index, 1);
          h.unshift(id);
          if (h.length > 20) h = h.slice(0, 20);
          localStorage.setItem(
            "playlist_history_" + state.api,
            JSON.stringify(h)
          );
        } catch (e) {}
      }
      function getPlaylistCache(id) {
        try {
          var c = localStorage.getItem(
            "playlist_cache_" + state.api + "_" + id
          );
          return c ? JSON.parse(c) : null;
        } catch (e) {
          return null;
        }
      }
      function setPlaylistCache(p) {
        try {
          localStorage.setItem(
            "playlist_cache_" + state.api + "_" + p.id,
            JSON.stringify({
              id: String(p.id),
              name: p.name || "未命名歌单",
              coverImgUrl: p.coverImgUrl || "",
              trackCount: p.trackCount || 0
            })
          );
        } catch (e) {}
      }
      function account(n) {
        $("accountLabel").textContent = n || "未登录";
        $("loginButton").textContent = n ? "更换 Cookie" : "登录";
      }
      function editor(v) {
        setHidden($("cookieEditor"), !v);
        setHidden($("loginButton"), v);
        // 输入框可能被隐藏了，隐藏时不要抢焦点
        if (v && !$("cookieInput").hidden) $("cookieInput").focus();
      }
      function updateCookieHint() {
        $("cookieHint").innerHTML = source().cookieHint;
        // 酷狗只能扫码登录，粘贴框和保存按钮都用不上
        var kugou = state.api === "kugou";
        setHidden($("qrLoginBtn"), !kugou);
        setHidden($("cookieInput"), kugou);
        setHidden($("saveCookie"), kugou);
      }
      function isDesktop() {
        if (window.matchMedia) return window.matchMedia("(min-width:651px)").matches;
        return document.documentElement.clientWidth > 650;
      }
      function scrollToTop() {
        if (window.scrollTo) window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      function renderLists() {
        var list = $("playlistList");
        var playlists = state.playlists.slice(0);
        var i;
        var p;
        var b;
        var imageNode;
        var meta;
        var name;
        var count;
        if (loggedIn && source().daily) {
          playlists = [
            {
              id: DAILY_ID,
              name: "每日推荐",
              coverImgUrl: "/favicon.ico",
              trackCount: null,
              daily: true
            }
          ].concat(playlists);
        }
        list.textContent = "";
        if (!playlists.length) {
          list.innerHTML = '<div class="empty-state">暂无歌单</div>';
          return;
        }
        for (i = 0; i < playlists.length; i++) {
          p = playlists[i];
          b = document.createElement("button");
          b.type = "button";
          b.className =
            "playlist-item" +
            (String(p.id) === state.currentId ? " active" : "");
          imageNode = document.createElement("img");
          image(imageNode, p.coverImgUrl);
          meta = document.createElement("span");
          meta.className = "playlist-meta";
          name = document.createElement("span");
          name.className = "playlist-name";
          name.textContent = p.name || "未命名歌单";
          count = document.createElement("span");
          count.className = "playlist-count";
          count.textContent =
            p.daily && p.trackCount == null
              ? "33 首歌曲"
              : (p.trackCount || 0) + " 首歌曲";
          meta.appendChild(name);
          meta.appendChild(count);
          b.appendChild(imageNode);
          b.appendChild(meta);
          b.onclick = (function (playlist) {
            return function () {
              select(playlist);
            };
          })(p);
          list.appendChild(b);
        }
      }
      function eachTrackRow(callback) {
        var rows = document.querySelectorAll("#trackList .track-row");
        var i;
        for (i = 0; i < rows.length; i++) callback(rows[i], i, rows);
      }
      function updatePlaying(id) {
        state.nowId = id == null ? "" : String(id);
        eachTrackRow(function (row) {
          toggleClass(
            row,
            "playing",
            row.getAttribute("data-id") === state.nowId
          );
        });
      }
      function refreshPlayingStatus() {
        if (statusRefreshing) return;
        statusRefreshing = true;
        json(
          "/status?t=" + new Date().getTime(),
          function (s) {
            statusRefreshing = false;
            updatePlaying(s.nowId);
          },
          function () {
            statusRefreshing = false;
          }
        );
      }
      // 同一个歌单只请求一次，并发调用排队等结果
      function fetchPlaylistData(id, done, failed) {
        var key = String(id);
        var waiters;
        var i;
        failed = failed || function () {};
        if (key === DAILY_ID) {
          source().daily(done, failed);
          return;
        }
        if (state.details[key]) {
          done(state.details[key]);
          return;
        }
        if (detailWaiters[key]) {
          detailWaiters[key].push({ done: done, failed: failed });
          return;
        }
        detailWaiters[key] = [{ done: done, failed: failed }];
        source().playlistDetail(
          key,
          function (d) {
            waiters = detailWaiters[key] || [];
            delete detailWaiters[key];
            state.details[key] = d;
            for (i = 0; i < waiters.length; i++) waiters[i].done(d);
          },
          function (error) {
            waiters = detailWaiters[key] || [];
            delete detailWaiters[key];
            for (i = 0; i < waiters.length; i++) waiters[i].failed(error);
          }
        );
      }
      // 只要歌单元信息，用于列表展示
      function fetchPlaylistInfo(id, callback) {
        var cached = getPlaylistCache(id);
        var key = String(id);
        var fromDetail = state.details[key];
        if (fromDetail) {
          callback({
            id: key,
            name: fromDetail.name,
            coverImgUrl: fromDetail.coverImgUrl,
            trackCount: fromDetail.trackCount
          });
          return;
        }
        if (cached) {
          callback(cached);
          return;
        }
        source().playlistDetail(
          key,
          function (d) {
            var info = {
              id: key,
              name: d.name || "未命名歌单",
              coverImgUrl: d.coverImgUrl || "",
              trackCount: d.trackCount || 0
            };
            setPlaylistCache(info);
            callback(info);
          },
          function () {
            callback(null);
          }
        );
      }
      function fetchPlaylistInfos(ids, done) {
        var out = [];
        var pending = ids.length;
        var i;
        if (!pending) {
          done(out);
          return;
        }
        for (i = 0; i < ids.length; i++) {
          (function (id) {
            fetchPlaylistInfo(id, function (info) {
              if (info) out.push(info);
              pending--;
              if (pending === 0) done(out);
            });
          })(ids[i]);
        }
      }
      function play(ids) {
        if (!ids.length || !state.selected) return;
        updatePlaying(ids[0]);
        if (state.selected.id !== DAILY_ID) addHistory(String(state.selected.id));
        request(
          "/playmusiclist?ids=" +
            encodeURIComponent(ids.join(",")) +
            "&id=" +
            encodeURIComponent(
              state.selected.id === DAILY_ID ? "" : state.selected.id
            ),
          function () {
            msg("播放 " + ids.length + " 首歌曲");
          },
          function (e) {
            msg("播放请求失败：" + e.message, true);
          }
        );
      }
      function tracks(ts) {
        var list = $("trackList");
        var i;
        var t;
        var row;
        var mark;
        var number;
        var info;
        var name;
        var artists;
        list.textContent = "";
        ts = ts || [];
        for (i = 0; i < ts.length; i++) {
          t = ts[i];
          row = document.createElement("div");
          row.className =
            "track-row" + (String(t.id) === state.nowId ? " playing" : "");
          row.setAttribute("data-id", t.id);
          mark = document.createElement("span");
          mark.className = "playing-mark";
          mark.textContent = "▶";
          number = document.createElement("span");
          number.className = "track-index";
          number.textContent = i + 1;
          info = document.createElement("span");
          info.className = "track-info";
          name = document.createElement("span");
          name.className = "track-name";
          name.textContent = t.name;
          artists = document.createElement("span");
          artists.className = "track-artists";
          artists.textContent = t.artists;
          info.appendChild(name);
          info.appendChild(artists);
          row.appendChild(mark);
          row.appendChild(number);
          row.appendChild(info);
          list.appendChild(row);
        }
      }
      function showSelectError(e) {
        setHidden($("detailEmpty"), false);
        msg("歌单加载失败：" + e.message, true);
      }
      function select(p, showDetail) {
        var detailTracks;
        var ids;
        var i;
        if (typeof showDetail === "undefined") showDetail = true;
        scrollToTop();
        state.selected = p;
        state.currentId = String(p.id);
        state.trackIds = [];
        setHidden($("detailEmpty"), true);
        setHidden($("detailContent"), true);
        $("detailId").textContent =
          p.id === DAILY_ID ? "" : "歌单 ID: " + p.id;
        msg("正在加载歌单……");
        fetchPlaylistData(
          p.id,
          function (d) {
            if (state.selected !== p) return;
            detailTracks = d.tracks || [];
            p.name = d.name || p.name;
            p.coverImgUrl = d.coverImgUrl || p.coverImgUrl;
            p.trackCount =
              d.trackCount != null ? d.trackCount : detailTracks.length;
            if (p.id !== DAILY_ID) {
              setPlaylistCache(p);
              if (String(p.id) === playingListId) addHistory(playingListId);
            }
            ids = [];
            for (i = 0; i < detailTracks.length; i++) ids.push(detailTracks[i].id);
            state.trackIds = ids;
            renderLists();
            image($("detailCover"), d.coverImgUrl);
            $("detailName").textContent = d.name || p.name;
            $("detailCount").textContent = "共 " + detailTracks.length + " 首歌曲";
            tracks(detailTracks);
            bindFullTrackClicks();
            setHidden($("detailContent"), false);
            msg("歌单加载成功");
            if (showDetail) {
              addClass($("libraryPanel"), "mobile-hidden");
              removeClass($("detailPanel"), "mobile-hidden");
            }
          },
          function (e) {
            if (state.selected === p) showSelectError(e);
          }
        );
      }
      function bindFullTrackClicks() {
        var rows = document.querySelectorAll("#trackList .track-row");
        var i;
        for (i = 0; i < rows.length; i++) {
          rows[i].onclick = (function (index) {
            return function () {
              play(state.trackIds.slice(index));
            };
          })(i);
        }
      }
      function loadError(e) {
        account("登录状态读取失败");
        $("playlistList").innerHTML =
          '<div class="empty-state">歌单加载失败</div>';
        msg(source().label + "接口请求失败：" + e.message, true);
      }
      function mergeUnique(lists) {
        var seen = {};
        var result = [];
        var i;
        var j;
        var p;
        for (i = 0; i < lists.length; i++) {
          for (j = 0; j < lists[i].length; j++) {
            p = lists[i][j];
            if (p && p.id != null && !seen[String(p.id)]) {
              seen[String(p.id)] = true;
              result.push(p);
            }
          }
        }
        return result;
      }
      // 当前歌单、默认歌单、闹钟歌单、历史，去重后补齐元信息
      function collectPlaylists(userPlaylists, canSelect) {
        var known = {};
        var ids = [];
        var i;
        var all;
        var target = null;
        function pushId(id) {
          id = id == null ? "" : String(id);
          if (!id || known[id]) return;
          known[id] = true;
          ids.push(id);
        }
        for (i = 0; i < userPlaylists.length; i++) {
          known[String(userPlaylists[i].id)] = true;
        }
        pushId(state.currentId);
        pushId(defPlayListId);
        pushId(nePlayListId);
        var history = getHistory();
        for (i = 0; i < history.length; i++) pushId(history[i]);

        fetchPlaylistInfos(ids, function (extras) {
          all = mergeUnique([userPlaylists, extras]);
          state.playlists = all;
          renderLists();
          for (i = 0; i < all.length; i++) {
            if (String(all[i].id) === String(state.currentId)) {
              target = all[i];
              break;
            }
          }
          if (!target && all.length) target = all[0];
          if (target) {
            select(target, isDesktop() && canSelect);
          } else {
            msg("请选择一个歌单开始播放");
          }
        });
      }
      function refresh() {
        var src = source();
        loggedIn = false;
        state.selected = null;
        state.trackIds = [];
        state.playlists = [];
        state.details = {};
        detailWaiters = {};
        playingListId = "";
        account("");
        updateCookieHint();
        setHidden($("detailContent"), true);
        setHidden($("detailEmpty"), false);
        renderLists();
        msg("正在加载歌单……");
        json(
          "/status?t=" + new Date().getTime(),
          function (s) {
            state.currentId = s.playListId || "";
            playingListId = state.currentId;
            state.nowId = s.nowId || "";
            src.userInfo(
              function (uid) {
                loggedIn = true;
                account("用户 " + uid);
                src.userPlaylists(
                  uid,
                  function (list, nickname) {
                    if (nickname) account(nickname);
                    collectPlaylists(list, true);
                  },
                  function (e) {
                    // 把上游返回的错误显示出来，方便判断是登录态还是接口问题
                    var text = e && e.message ? e.message : "未知错误";
                    console.error("歌单列表获取失败", text);
                    msg("歌单列表获取失败：" + text, true);
                    collectPlaylists([], true);
                  }
                );
              },
              function () {
                account("");
                collectPlaylists([], false);
              }
            );
          },
          loadError
        );
      }
      function load() {
        json(
          "/cfg.json?t=" + new Date().getTime(),
          function (cfg) {
            state.api = SOURCES[cfg.musicApi] ? cfg.musicApi : "netease";
            defPlayListId = cfg.defPlayListId || "";
            nePlayListId = cfg.nePlayListId || "";
            refresh();
          },
          loadError
        );
      }
      $("cookieInput").type = "text";
      $("loginButton").onclick = function () {
        editor(true);
      };
      // 酷狗拿歌单要 App 端的 token，官网 cookie 不行，所以走扫码页
      $("qrLoginBtn").onclick = function () {
        location.href = "/kugouLogin.html";
      };
      $("saveCookie").onclick = function () {
        var value = $("cookieInput").value.replace(/^\s+|\s+$/g, "");
        if (!value) {
          msg("请输入 Cookie", true);
          return;
        }
        postForm(
          "/setCookie",
          "cookie=" + encodeURIComponent(value),
          function () {
            editor(false);
            msg("Cookie 已保存到本机");
            load();
          },
          function (e) {
            msg("保存 Cookie 失败：" + e.message, true);
          }
        );
      };
      $("clearCookie").onclick = function () {
        postForm(
          "/setCookie",
          "cookie=",
          function () {
            $("cookieInput").value = "";
            editor(false);
            account("");
            msg("Cookie 已清除");
            load();
          },
          function (e) {
            msg("清除 Cookie 失败：" + e.message, true);
          }
        );
      };
      $("backButton").onclick = function () {
        addClass($("detailPanel"), "mobile-hidden");
        removeClass($("libraryPanel"), "mobile-hidden");
      };
      $("playAll").onclick = function () {
        play(state.trackIds.slice(0));
      };
      load();
      setInterval(refreshPlayingStatus, 60000);
    </script>
  </body>
</html>
