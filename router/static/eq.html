<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <title>均衡器</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 滑块行：标签 / 滑块 / 数值 三列都用左浮，任何浏览器都不会错位 */
        .eq-row {
            overflow: hidden;
            padding: 9px 0;
            border-top: 1px solid #eef0f4;
        }
        .eq-row:first-child {
            border-top: 0;
        }
        .eq-row > label {
            float: left;
            width: 52px;
            font-size: 16px;
            line-height: 36px;
            color: #6b7280;
        }
        .eq-row > input[type="range"] {
            float: left;
            width: 46%;
            max-width: 300px;
            margin: 9px 12px 0 0;
        }
        .eq-row > .val {
            float: left;
            min-width: 72px;
            font-size: 15px;
            line-height: 36px;
            color: #111418;
        }
        #msg {
            min-height: 24px;
            font-size: 15px;
            color: #3498db;
        }
        @media (max-width: 420px) {
            .eq-row > input[type="range"] {
                width: 44%;
            }
        }
        @media (prefers-color-scheme: dark) {
            .eq-row {
                border-top-color: #2b2f37;
            }
            .eq-row > label {
                color: #9aa1ad;
            }
            .eq-row > .val {
                color: #e9eaee;
            }
            #msg {
                color: #5dade2;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="page-head">
            <a href="/"><img class="brand" src="/favicon.ico" width="44" height="44" alt="返回首页"></a>
            <div class="page-head-text">
                <h1 class="page-title">均衡器</h1>
            </div>
        </header>

        <div class="card">
            <div class="ui-row">
                <span class="ui-label">开关</span>
                <div class="ui-ctl">
                    <input type="checkbox" id="enabled" onchange="apply()">
                    <span class="hint">开启后下一首生效</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="group-title">低音</h2>
            <div class="eq-row">
                <label>增益</label>
                <input type="range" id="bass" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="bassVal">0.0 dB</span>
            </div>
            <div class="eq-row">
                <label>拐点</label>
                <input type="range" id="bassFreq" min="60" max="500" step="5" value="120" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="bassFreqVal">120 Hz</span>
            </div>
        </div>

        <div class="card">
            <h2 class="group-title">中音</h2>
            <div class="eq-row">
                <label>增益</label>
                <input type="range" id="mid" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="midVal">0.0 dB</span>
            </div>
            <div class="eq-row">
                <label>中心</label>
                <input type="range" id="midFreq" min="300" max="4000" step="10" value="1000" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="midFreqVal">1000 Hz</span>
            </div>
        </div>

        <div class="card">
            <h2 class="group-title">高音</h2>
            <div class="eq-row">
                <label>增益</label>
                <input type="range" id="treble" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="trebleVal">0.0 dB</span>
            </div>
            <div class="eq-row">
                <label>拐点</label>
                <input type="range" id="trebleFreq" min="2000" max="16000" step="100" value="8000" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="trebleFreqVal">8000 Hz</span>
            </div>
        </div>

        <div class="card">
            <div class="eq-row">
                <label>预增益</label>
                <input type="range" id="preamp" min="-12" max="0" step="0.5" value="0" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="preampVal">0.0 dB</span>
            </div>
        </div>

        <div class="card">
            <h2 class="group-title">虚拟低音</h2>
            <div class="eq-row">
                <label>强度</label>
                <input type="range" id="vbass" min="0" max="100" step="5" value="0" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="vbassVal">0%</span>
            </div>
            <div class="eq-row">
                <label>上限</label>
                <input type="range" id="vbassFreq" min="40" max="300" step="5" value="100" oninput="show(); apply()" onchange="show(); apply()">
                <span class="val" id="vbassFreqVal">100 Hz</span>
            </div>
        </div>

        <div class="card">
            <p class="ui-hint">
                关闭或滑块值为 0 时不费性能，开的越多，越费性能<br>
                虚拟低音可以给给放不出低频的小喇叭“补”出低音的感觉<br>
                低音拐点调到 200~400Hz 更容易听出“厚”的变化<br>
                加太多会削波，用预增益压一点
            </p>
            <div id="msg"></div>
            <div class="ui-row ui-row-end">
                <div class="ui-ctl">
                    <button type="button" class="ghost" onclick="load()">刷新</button>
                    <button type="button" onclick="reset()">重置</button>
                </div>
            </div>
        </div>
    </div>

<script>
var timer = null;
// 增益和频率的输入框 id
var GAIN_IDS = ['bass', 'mid', 'treble'];
var FREQ_IDS = ['bassFreq', 'midFreq', 'trebleFreq'];
var ALL_IDS = GAIN_IDS.concat(FREQ_IDS, ['preamp', 'vbass', 'vbassFreq']);

function $(id) { return document.getElementById(id); }

function fmtDb(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB'; }

// 用 XHR 而不是 fetch：老 Safari / 老 Kindle 浏览器没有 Promise
function api(url, done) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        var data = null;
        if (xhr.status >= 200 && xhr.status < 300) {
            try { data = JSON.parse(xhr.responseText); } catch (e) {}
        }
        done(data);
    };
    try {
        xhr.send();
    } catch (e) {
        done(null);
    }
}

function show() {
    var gains = GAIN_IDS.concat(['preamp']);
    var i, v;
    for (i = 0; i < gains.length; i++) {
        v = parseFloat($(gains[i]).value);
        $(gains[i] + 'Val').textContent = fmtDb(v);
    }
    for (i = 0; i < FREQ_IDS.length; i++) {
        v = parseInt($(FREQ_IDS[i]).value, 10);
        $(FREQ_IDS[i] + 'Val').textContent = v + ' Hz';
    }
    $('vbassVal').textContent = parseInt($('vbass').value, 10) + '%';
    $('vbassFreqVal').textContent = parseInt($('vbassFreq').value, 10) + ' Hz';
}

function msg(s) { $('msg').textContent = s; }

// 拖动滑块会连续触发，合并成 150ms 一次请求
function apply() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(send, 150);
}

function send() {
    var q = 'enabled=' + ($('enabled').checked ? 1 : 0);
    var i;
    for (i = 0; i < ALL_IDS.length; i++) {
        q += '&' + ALL_IDS[i] + '=' + $(ALL_IDS[i]).value;
    }
    msg('正在应用…');
    api('/eqset?' + q, function (j) {
        msg(j && j.ok ? '已应用' : '失败');
    });
}

function load() {
    api('/eq', function (eq) {
        if (!eq) {
            msg('加载失败');
            return;
        }
        $('enabled').checked = !!eq.enabled;
        var bands = eq.bands || [];
        var map = { lowshelf: 'bass', peaking: 'mid', highshelf: 'treble' };
        var i, b, id;
        for (i = 0; i < bands.length; i++) {
            b = bands[i];
            id = map[b.type];
            if (!id) continue;
            $(id).value = b.gain;
            if (b.freq) $(id + 'Freq').value = b.freq;
        }
        $('preamp').value = eq.preamp || 0;
        $('vbass').value = eq.virtualBass || 0;
        $('vbassFreq').value = eq.virtualBassFreq || 100;
        show();
        msg('已加载');
    });
}

function reset() {
    var i;
    var gains = GAIN_IDS.concat(['preamp']);
    for (i = 0; i < gains.length; i++) $(gains[i]).value = 0;
    $('bassFreq').value = 120;
    $('midFreq').value = 1000;
    $('trebleFreq').value = 8000;
    $('vbass').value = 0;
    $('vbassFreq').value = 100;
    show();
    apply();
}

show();
load();
</script>
</body>
</html>
