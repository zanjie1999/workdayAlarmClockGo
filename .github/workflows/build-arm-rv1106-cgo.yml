name: Build ARM (libjpeg) with RV1106 uClibc toolchain

# Build the application using the same RV1106/RV1103 uClibc

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_PREFIX: arm-rockchip830-linux-uclibcgnueabihf

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            cmake \
            curl \
            file \
            git \
            gettext \
            autopoint \
            bison \
            flex \
            libtool \
            make \
            pkg-config \
            wget \
            xz-utils

      - name: Download RV1106 uClibc toolchain
        run: |
          git clone --depth=1 \
            https://github.com/deerpi/arm-rockchip830-linux-uclibcgnueabihf.git \
            toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build ZYB ARM binary with libjpeg-turbo and ALSA
        shell: bash
        run: |
          set -euo pipefail
          go mod download

          ${TOOLCHAIN_PREFIX}-gcc --version
          SYSROOT="$(${TOOLCHAIN_PREFIX}-gcc -print-sysroot)"
          echo "RV1106 sysroot: $SYSROOT"

          WORK="$RUNNER_TEMP/zyb-rv1106-uclibc"
          # Match the ALSA version built in rv1106-alsa-tools.yml.
          ALSA_VERSION=1.2.6.1
          ALSA_SOURCE="$WORK/alsa-lib-$ALSA_VERSION"
          ALSA_STAGE="$WORK/alsa-stage"
          JPEG_SOURCE="$RUNNER_TEMP/libjpeg-turbo-3.0.4"
          JPEG_PREFIX="$WORK/jpeg"
          mkdir -p "$WORK" "$ALSA_STAGE" build

          # Build ALSA for the target using the RV1106 workflow's toolchain.
          wget --tries=3 \
            "https://www.alsa-project.org/files/pub/lib/alsa-lib-$ALSA_VERSION.tar.bz2" \
            -O "$WORK/alsa-lib.tar.bz2"
          tar -xjf "$WORK/alsa-lib.tar.bz2" -C "$WORK"
          (
            cd "$ALSA_SOURCE"
            ./configure \
              --host="$TOOLCHAIN_PREFIX" \
              --prefix=/usr \
              --disable-python
            make -j"$(nproc)"
            make DESTDIR="$ALSA_STAGE" install
          )

          # Build libjpeg-turbo as a target static library. No glibc sysroot
          # is needed: the cross compiler supplies its uClibc target sysroot.
          curl --fail --location --retry 3 \
            https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.4/libjpeg-turbo-3.0.4.tar.gz \
            --output "$WORK/libjpeg-turbo.tar.gz"
          tar -xzf "$WORK/libjpeg-turbo.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$JPEG_SOURCE" -B "$WORK/jpeg-build" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER="${TOOLCHAIN_PREFIX}-gcc" \
            -DCMAKE_INSTALL_PREFIX="$JPEG_PREFIX" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF
          cmake --build "$WORK/jpeg-build" --target install -j"$(nproc)"
          test -r "$JPEG_PREFIX/include/jpeglib.h"
          test -r "$JPEG_PREFIX/lib/libjpeg.a"

          sed -i 's|^[[:space:]]*"image/jpeg"[[:space:]]*$|\t"github.com/pixiv/go-libjpeg/jpeg"|' display/fb_linux.go
          sed -i 's|jpeg.Decode(bytes.NewReader(frame.buf.Bytes()))|jpeg.Decode(bytes.NewReader(frame.buf.Bytes()), \&jpeg.DecoderOptions{})|' display/fb_linux.go
          grep -Fq '"github.com/pixiv/go-libjpeg/jpeg"' display/fb_linux.go
          grep -Fq 'jpeg.Decode(bytes.NewReader(frame.buf.Bytes()), &jpeg.DecoderOptions{})' display/fb_linux.go

          env \
            GOOS=linux \
            GOARCH=arm \
            GOARM=7 \
            CGO_ENABLED=1 \
            CC="${TOOLCHAIN_PREFIX}-gcc" \
            CGO_CFLAGS="-I$ALSA_STAGE/usr/include -I$JPEG_PREFIX/include" \
            CGO_LDFLAGS="-L$ALSA_STAGE/usr/lib -L$JPEG_PREFIX/lib" \
            go build -trimpath -tags alsa -ldflags="-w -s" \
              -o build/workdayAlarmClock-linux-rv1106-uclibc-armv7 ./

          BINARY=build/workdayAlarmClock-linux-rv1106-uclibc-armv7
          file "$BINARY"
          ${TOOLCHAIN_PREFIX}-readelf -h "$BINARY" | grep -E 'Class:|Data:|Machine:|Flags:'
          NEEDED_LIBRARIES="$( ${TOOLCHAIN_PREFIX}-readelf -d "$BINARY" )"
          printf '%s\n' "$NEEDED_LIBRARIES" | grep NEEDED
          if ! grep -q 'Shared library: \[libasound.so.2\]' <<< "$NEEDED_LIBRARIES"; then
            echo "Binary is missing its expected libasound.so.2 dependency" >&2
            exit 1
          fi
          if grep -qi 'Shared library: \[libc.so.6\]' <<< "$NEEDED_LIBRARIES"; then
            echo "Binary unexpectedly depends on glibc libc.so.6" >&2
            exit 1
          fi
          if grep -q 'Shared library: \[libjpeg' <<< "$NEEDED_LIBRARIES"; then
            echo "Binary unexpectedly has a dynamic libjpeg dependency" >&2
            exit 1
          fi
          sha256sum "$BINARY"

      - name: Upload RV1106 uClibc binary
        uses: actions/upload-artifact@v4
        with:
          name: workdayAlarmClock-linux-rv1106-uclibc-armv7
          path: build/workdayAlarmClock-linux-rv1106-uclibc-armv7
          if-no-files-found: error
