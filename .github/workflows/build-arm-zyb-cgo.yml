name: Build ARM (zyb smartpen) CGO binary (libjpeg + ALSA)

# Target device (verified via adb shell):
#   - unisoc-wayland zb01 (sl8541e-smartpen32), Linux 4.14.174
#   - ARMv7-A hard-float (armhf, ld-linux-armhf.so.3), NEON/VFPv4
#   - glibc 2.27, alsa-lib 1.1.5 (libasound.so.2), libjpeg.so.62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ARM cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-arm-linux-gnueabihf \
            cmake \
            curl \
            gcc-arm-linux-gnueabihf \
            make \
            xz-utils

      - name: Build ARM binary with libjpeg and ALSA
        shell: bash
        run: |
          set -euo pipefail
          go mod download

          WORK="$RUNNER_TEMP/armhf-cgo"
          SYSROOT="$WORK/sysroot"
          ALSA_STAGE="$WORK/alsa-stage"
          JPEG_SOURCE="$RUNNER_TEMP/libjpeg-turbo-3.0.4"
          JPEG_PREFIX="$WORK/jpeg"
          mkdir -p "$WORK" "$SYSROOT" "$ALSA_STAGE" build

          # Use the glibc 2.27 sysroot matching the target device.
          ARMHF_BASE_URL="https://archive.ubuntu.com/ubuntu/pool/main/c/cross-toolchain-base"
          for package in \
            libc6-armhf-cross_2.27-3ubuntu1cross1.1_all.deb \
            libc6-dev-armhf-cross_2.27-3ubuntu1cross1.1_all.deb \
            linux-libc-dev-armhf-cross_4.15.0-35.38cross1.1_all.deb; do
            curl --fail --location --retry 3 \
              "$ARMHF_BASE_URL/$package" \
              --output "$WORK/$package"
            dpkg-deb -x "$WORK/$package" "$SYSROOT"
          done
          test -r "$SYSROOT/usr/arm-linux-gnueabihf/include/gnu/stubs-hard.h"
          test -r "$SYSROOT/usr/arm-linux-gnueabihf/lib/crt1.o"
          if [[ ! -e "$SYSROOT/usr/include" ]]; then
            ln -s arm-linux-gnueabihf/include "$SYSROOT/usr/include"
          fi
          if [[ ! -e "$SYSROOT/lib" ]]; then
            ln -s usr/arm-linux-gnueabihf/lib "$SYSROOT/lib"
          fi
          ARMHF_LIB="$SYSROOT/usr/arm-linux-gnueabihf/lib"
          ARMHF_INCLUDE="$SYSROOT/usr/arm-linux-gnueabihf/include"
          ARMHF_CC="arm-linux-gnueabihf-gcc --sysroot=$SYSROOT -B$ARMHF_LIB/ -isystem $ARMHF_INCLUDE -L$ARMHF_LIB"

          # The executable relies on the target's existing libasound.so.2
          # (alsa-lib 1.1.5 on the device).
          ALSA_VERSION=1.1.5
          ALSA_SOURCE="$WORK/alsa-lib-$ALSA_VERSION"
          curl --fail --location --retry 3 \
            "https://www.alsa-project.org/files/pub/lib/alsa-lib-$ALSA_VERSION.tar.bz2" \
            --output "$WORK/alsa-lib.tar.bz2"
          tar -xjf "$WORK/alsa-lib.tar.bz2" -C "$WORK"
          (
            cd "$ALSA_SOURCE"
            CC="$ARMHF_CC" \
            CFLAGS="-O2 -fPIC" \
            PKG_CONFIG=false \
            ./configure \
              --host=arm-linux-gnueabihf \
              --prefix=/usr \
              --disable-static \
              --enable-shared \
              --disable-python \
              --without-versioned
            make -j"$(nproc)"
            make DESTDIR="$ALSA_STAGE" install
          )

          # Build libjpeg-turbo as a target static library and use the same
          # JPEG backend replacement as the multi-architecture CGO workflow.
          curl --fail --location --retry 3 \
            https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.4/libjpeg-turbo-3.0.4.tar.gz \
            --output "$WORK/libjpeg-turbo.tar.gz"
          tar -xzf "$WORK/libjpeg-turbo.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$JPEG_SOURCE" -B "$WORK/jpeg-build" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_SYSROOT="$SYSROOT" \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_C_FLAGS="-B$ARMHF_LIB/ -isystem $ARMHF_INCLUDE" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$ARMHF_LIB" \
            -DCMAKE_INSTALL_PREFIX="$JPEG_PREFIX" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF
          cmake --build "$WORK/jpeg-build" --target install -j"$(nproc)"
          test -r "$JPEG_PREFIX/include/jpeglib.h"
          test -r "$JPEG_PREFIX/lib/libjpeg.a"

          sed -i 's|^[[:space:]]*"image/jpeg"[[:space:]]*$|\t"github.com/pixiv/go-libjpeg/jpeg"|' display/fb_linux.go
          sed -i 's|jpeg.Decode(bytes.NewReader(frame.buf.Bytes()))|jpeg.Decode(bytes.NewReader(frame.buf.Bytes()), \&jpeg.DecoderOptions{})|' display/fb_linux.go
          grep -Fq '"github.com/pixiv/go-libjpeg/jpeg"' display/fb_linux.go
          grep -Fq 'jpeg.Decode(bytes.NewReader(frame.buf.Bytes()), &jpeg.DecoderOptions{})' display/fb_linux.go

          env \
            GOOS=linux \
            GOARCH=arm \
            GOARM=7 \
            CGO_ENABLED=1 \
            CC="$ARMHF_CC" \
            CGO_CFLAGS="-I$ALSA_STAGE/usr/include -I$JPEG_PREFIX/include" \
            CGO_LDFLAGS="-L$ALSA_STAGE/usr/lib -L$JPEG_PREFIX/lib" \
            go build -trimpath -tags alsa -ldflags="-w -s" \
              -o build/workdayAlarmClock-linux-armv7 ./

          file build/workdayAlarmClock-linux-armv7
          arm-linux-gnueabihf-readelf -h build/workdayAlarmClock-linux-armv7 | grep -E 'Class:|Data:|Machine:|Flags:'
          NEEDED_LIBRARIES="$(arm-linux-gnueabihf-readelf -d build/workdayAlarmClock-linux-armv7)"
          printf '%s\n' "$NEEDED_LIBRARIES" | grep NEEDED
          if ! grep -q 'Shared library: \[libasound.so.2\]' <<< "$NEEDED_LIBRARIES"; then
            echo "ARM binary is missing its expected libasound.so.2 dependency" >&2
            exit 1
          fi
          if arm-linux-gnueabihf-readelf --version-info build/workdayAlarmClock-linux-armv7 | grep -Eq 'GLIBC_2\.(2[8-9]|[3-9][0-9])'; then
            echo "ARM binary requires glibc newer than the target-compatible 2.27 sysroot" >&2
            exit 1
          fi
          if grep -q 'Shared library: \[libjpeg' <<< "$NEEDED_LIBRARIES"; then
            echo "ARM binary unexpectedly has a dynamic libjpeg dependency" >&2
            exit 1
          fi
          sha256sum build/workdayAlarmClock-linux-armv7

      - name: Upload ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: workdayAlarmClock-linux-armv7
          path: build/workdayAlarmClock-linux-armv7
          if-no-files-found: error
