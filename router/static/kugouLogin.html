<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>酷狗扫码登录</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .qrbox {
        padding: 18px;
        text-align: center;
      }
      /* 二维码容器固定方形，靠 line-height 居中，不用 flex；
         图片只缩放不裁剪，object-fit:contain 在 iOS 7 上不支持会把码拉变形扫不出来 */
      .qr {
        width: 220px;
        height: 220px;
        margin: 0 auto 14px;
        line-height: 218px;
        text-align: center;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e3e5ea;
        border-radius: 12px;
        -webkit-border-radius: 12px;
      }
      .qr img {
        display: inline-block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        vertical-align: middle;
      }
      .qr .placeholder {
        display: inline-block;
        line-height: 1.6;
        font-size: 15px;
        color: #8a919e;
        vertical-align: middle;
      }
      #status {
        min-height: 26px;
        font-size: 16px;
        line-height: 1.6;
        color: #6b7280;
      }
      #status.ok {
        color: #178a52;
      }
      #status.error {
        color: #e5484d;
      }
      #retry {
        margin-top: 6px;
      }
      @media (prefers-color-scheme: dark) {
        #status {
          color: #9aa1ad;
        }
        #status.ok {
          color: #57d195;
        }
        #status.error {
          color: #ff6369;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <header class="page-head">
        <a href="/playlist.html"><img class="brand" src="/favicon.ico" width="44" height="44" alt="返回歌单" /></a>
        <div class="page-head-text">
          <h1 class="page-title">酷狗扫码登录</h1>
        </div>
      </header>

      <div class="card qrbox">
        <div class="qr" id="qr"><div class="placeholder">正在获取二维码…</div></div>
        <div id="status">请稍候</div>
        <button type="button" id="retry" hidden>重新获取二维码</button>
      </div>
    </div>
    <script>
      (function () {
        var qr = document.getElementById("qr");
        var statusEl = document.getElementById("status");
        var retry = document.getElementById("retry");
        var key = "";
        var timer = null;
        var stopped = false;

        function setStatus(text, kind) {
          statusEl.textContent = text;
          statusEl.className = kind || "";
        }

        function stop() {
          stopped = true;
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }

        function fail(text) {
          stop();
          setStatus(text, "error");
          retry.hidden = false;
          retry.style.display = "";
        }

        function get(url, done) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            var data = null;
            try {
              data = JSON.parse(xhr.responseText);
            } catch (e) {}
            done(xhr.status, data, xhr.responseText);
          };
          try {
            xhr.send();
          } catch (e) {
            done(0, null, "");
          }
        }

        // 扫码成功后把 userid/token 写进后端配置的 cookie
        function saveLogin(userid, token) {
          var cookie = "userid=" + userid + "; token=" + token;
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/setCookie", true);
          xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              setStatus("登录成功，正在返回歌单页…", "ok");
              setTimeout(function () {
                location.href = "/playlist.html";
              }, 1200);
            } else {
              fail("凭据保存失败，请返回歌单页重试");
            }
          };
          xhr.send("cookie=" + encodeURIComponent(cookie));
        }

        function poll() {
          if (stopped || !key) return;
          get("/kgapi/login/qr/check?key=" + encodeURIComponent(key), function (code, data) {
            if (stopped) return;
            if (code < 200 || code >= 300 || !data) return;
            var d = data.data || {};
            if (Number(d.status) === 4 && d.token && d.userid) {
              stop();
              saveLogin(d.userid, d.token);
              return;
            }
            if (Number(d.status) === 2) {
              setStatus("已扫码，请在手机上确认");
              return;
            }
            if (Number(d.status) === 0) {
              fail("二维码已过期，请重新获取");
            }
          });
        }

        function loadQr() {
          stopped = false;
          retry.hidden = true;
          retry.style.display = "none";
          qr.innerHTML = '<div class="placeholder">正在获取二维码…</div>';
          setStatus("请稍候");
          get("/kgapi/login/qr", function (code, data) {
            var d = data && data.data ? data.data : null;
            if (code < 200 || code >= 300 || !d || !d.qrcode || !d.qrcode_img) {
              fail("获取二维码失败，请稍后重试");
              return;
            }
            key = d.qrcode;
            var img = document.createElement("img");
            img.alt = "酷狗登录二维码";
            img.src = d.qrcode_img;
            qr.innerHTML = "";
            qr.appendChild(img);
            setStatus("请用手机酷狗音乐App扫码");
            if (timer) clearInterval(timer);
            timer = setInterval(poll, 2000);
          });
        }

        retry.onclick = loadQr;
        loadQr();
      })();
    </script>
  </body>
</html>
