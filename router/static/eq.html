<html>
<head>
    <title>均衡器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .band { margin: 18px 0; padding: 10px 0; border-bottom: 1px solid #eee; }
        .band h3 { margin: 0 0 8px; font-size: 1em; }
        .row { margin: 8px 0; }
        .row label { display: inline-block; width: 52px; color: #666; }
        input[type=range] { width: 52%; max-width: 280px; vertical-align: middle; }
        .val { display: inline-block; min-width: 76px; font-weight: bold; }
        #msg { min-height: 1.4em; color: #2a7; }
        .hint { color: #888; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="me-title">均衡器</h1>

        <div class="row">
            <label>开关</label>
            <input type="checkbox" id="enabled" onchange="apply()">
            <span class="hint">关闭时完全跳过处理</span>
        </div>

        <div class="band">
            <h3>低音</h3>
            <div class="row">
                <label>增益</label>
                <input type="range" id="bass" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()">
                <span class="val" id="bassVal">0.0 dB</span>
            </div>
            <div class="row">
                <label>拐点</label>
                <input type="range" id="bassFreq" min="60" max="500" step="5" value="120" oninput="show(); apply()">
                <span class="val" id="bassFreqVal">120 Hz</span>
            </div>
        </div>

        <div class="band">
            <h3>中音</h3>
            <div class="row">
                <label>增益</label>
                <input type="range" id="mid" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()">
                <span class="val" id="midVal">0.0 dB</span>
            </div>
            <div class="row">
                <label>中心</label>
                <input type="range" id="midFreq" min="300" max="4000" step="10" value="1000" oninput="show(); apply()">
                <span class="val" id="midFreqVal">1000 Hz</span>
            </div>
        </div>

        <div class="band">
            <h3>高音</h3>
            <div class="row">
                <label>增益</label>
                <input type="range" id="treble" min="-24" max="24" step="0.5" value="0" oninput="show(); apply()">
                <span class="val" id="trebleVal">0.0 dB</span>
            </div>
            <div class="row">
                <label>拐点</label>
                <input type="range" id="trebleFreq" min="2000" max="16000" step="100" value="8000" oninput="show(); apply()">
                <span class="val" id="trebleFreqVal">8000 Hz</span>
            </div>
        </div>

        <div class="row">
            <label>预增益</label>
            <input type="range" id="preamp" min="-12" max="0" step="0.5" value="0" oninput="show(); apply()">
            <span class="val" id="preampVal">0.0 dB</span>
        </div>

        <div class="hint">
            小喇叭低音下潜有限，60Hz 附近基本发不出声。<br>
            低音拐点调到 200~400Hz 更容易听出“厚”的变化。<br>
            加太多会削波，用预增益压一点。
        </div>

        <div id="msg"></div>

        <div class="row">
            <button onclick="load()">刷新</button>
            <button onclick="reset()">重置</button>
        </div>
    </div>

<script>
var timer = null;
// 增益和频率的输入框 id
var GAIN_IDS = ['bass', 'mid', 'treble'];
var FREQ_IDS = ['bassFreq', 'midFreq', 'trebleFreq'];
var ALL_IDS = GAIN_IDS.concat(FREQ_IDS, ['preamp']);

function fmtDb(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB'; }

function show() {
    GAIN_IDS.concat(['preamp']).forEach(function (id) {
        var v = parseFloat(document.getElementById(id).value);
        document.getElementById(id + 'Val').textContent = fmtDb(v);
    });
    FREQ_IDS.forEach(function (id) {
        var v = parseInt(document.getElementById(id).value);
        document.getElementById(id + 'Val').textContent = v + ' Hz';
    });
}

function msg(s) { document.getElementById('msg').textContent = s; }

// 拖动滑块会连续触发，合并成 150ms 一次请求
function apply() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(send, 150);
}

function send() {
    var q = 'enabled=' + (document.getElementById('enabled').checked ? 1 : 0);
    ALL_IDS.forEach(function (id) {
        q += '&' + id + '=' + document.getElementById(id).value;
    });
    fetch('/eqset?' + q)
        .then(function (r) { return r.json(); })
        .then(function (j) { msg(j.ok ? '已应用' : '失败'); })
        .catch(function () { msg('请求失败'); });
}

function load() {
    fetch('/eq')
        .then(function (r) { return r.json(); })
        .then(function (eq) {
            document.getElementById('enabled').checked = !!eq.enabled;
            var bands = eq.bands || [];
            var map = { lowshelf: 'bass', peaking: 'mid', highshelf: 'treble' };
            bands.forEach(function (b) {
                var id = map[b.type];
                if (!id) return;
                document.getElementById(id).value = b.gain;
                if (b.freq) document.getElementById(id + 'Freq').value = b.freq;
            });
            document.getElementById('preamp').value = eq.preamp || 0;
            show();
            msg('已加载');
        })
        .catch(function () { msg('加载失败'); });
}

function reset() {
    GAIN_IDS.concat(['preamp']).forEach(function (id) {
        document.getElementById(id).value = 0;
    });
    document.getElementById('bassFreq').value = 120;
    document.getElementById('midFreq').value = 1000;
    document.getElementById('trebleFreq').value = 8000;
    show();
    apply();
}

show();
load();
</script>
</body>
</html>
