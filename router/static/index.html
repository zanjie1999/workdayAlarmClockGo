<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <title>工作咩闹钟</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 模式相关的按钮先藏起来，等 /status 返回后再显示，避免闪一下 */
        .app-only, .linux-only { display: none; }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="page-head">
            <img class="brand" src="/favicon.ico" width="44" height="44" alt="">
            <div class="page-head-text">
                <h1 class="page-title">工作咩闹钟<span class="ver" id="ver"></span></h1>
            </div>
        </header>

        <div class="status" id="statusMsg"></div>

        <section class="card card-flush">
            <div class="btn-row btn-row-3">
                <form action="/stop">
                    <button type="submit">停止</button>
                </form>
                <form action="/pause">
                    <button type="submit">暂停</button>
                </form>
                <form action="/resume">
                    <button type="submit">恢复播放</button>
                </form>
            </div>
            <div class="btn-row">
                <form action="/volm">
                    <button type="submit">音量减</button>
                </form>
                <form action="/volp">
                    <button type="submit">音量加</button>
                </form>
                <form action="/prev">
                    <button type="submit">上一首</button>
                </form>
                <form action="/next">
                    <button type="submit">下一首</button>
                </form>
            </div>
        </section>

        <form class="card line-card" action="/play" method="get" id="playUrlForm" onsubmit="return playurl()">
            <div class="line">
                <span class="line-btn"><button type="submit">播放url</button></span>
                <span class="line-input"><input type="text" name="url" id="playUrl" value="http://127.0.0.1:8080/static/music.mp3"></span>
                <span class="line-tail"><label>循环 <input type="checkbox" name="loopMode" value="0"></label></span>
            </div>
        </form>

        <form class="card line-card" action="/playlist" method="get" id="playlistForm" onsubmit="return playlist()">
            <div class="line">
                <span class="line-btn"><button type="submit">播放歌单</button></span>
                <span class="line-input"><input type="text" name="id" id="playlistId" placeholder="歌单id或分享链接" value="21777546"></span>
                <span class="line-tail line-tail-wide">
                    <select name="random">
                        <option value="0">顺序播放</option>
                        <option value="1">随机播放</option>
                    </select>
                </span>
            </div>
        </form>

        <form class="card line-card" action="/playmusic" method="get" id="playmusicForm" onsubmit="return playmusic()">
            <div class="line">
                <span class="line-btn"><button type="submit">播放歌曲</button></span>
                <span class="line-input"><input type="text" name="id" id="playmusicId" placeholder="歌曲id或分享链接" value="2604307454"></span>
                <span class="line-tail"><label>循环 <input type="checkbox" name="loopMode" id="loopMode" value="0"></label></span>
            </div>
        </form>

        <form class="card line-card" action="/timeStop" method="get" id="timeStopForm">
            <div class="line">
                <span class="line-btn"><button type="submit">定时停止</button></span>
                <span class="line-input"><input type="number" name="min" id="timeStop" value="30.0" min="0" step="0.5"></span>
                <span class="line-tail">分钟后</span>
            </div>
        </form>

        <nav class="page-nav">
            <a href="/restart">重启</a>
            <a href="javascript:checkUpdate()">检查更新</a>
            <a href="/alarm.html">闹钟设置</a>
            <a href="/playlist.html">我的歌单</a>
            <a class="app-only" href="/echo?msg=SCREENON">亮屏</a>
            <a class="app-only" href="/echo?msg=SCREENOFF">熄屏</a>
            <a class="app-only" href="javascript:location.href='//'+location.hostname+':8880'">查看摄像头</a>
            <a class="linux-only" href="/eq.html">均衡器</a>
        </nav>
    </div>
    <script>
        function playlist() {
            var pl = document.getElementById('playlistId').value
            saveItem('lastPlayList', pl);
            return true;
        }
        function playmusic() {
            var pl = document.getElementById('playmusicId').value
            saveItem('lastPlayMusic', pl);
            return true;
        }
        function playurl() {
            saveItem('lastPlayUrl', document.getElementById('playUrl').value);
        }
        // iOS 无痕模式下 localStorage 会直接抛异常，读写都要包起来
        function saveItem(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {}
        }
        function readItem(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                return null;
            }
        }
        // 检查更新，只查不下载；有新版本再给出更新按钮
        function checkUpdate() {
            var el = document.getElementById('statusMsg');
            el.innerHTML = '正在检查更新...';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/checkUpdate?t=' + Date.now(), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState != 4) return;
                if (xhr.status != 200) {
                    var msg = '检查更新失败';
                    try { msg += '：' + JSON.parse(xhr.responseText).error } catch (e) {}
                    el.innerHTML = msg;
                    return;
                }
                var d = JSON.parse(xhr.responseText);
                if (!d.hasUpdate) {
                    el.innerHTML = '已是最新版本 v' + d.current;
                    return;
                }
                var html = '发现新版本 v' + d.latest + (d.size ? '（' + (d.size / 1048576).toFixed(1) + 'MB）' : '');
                if (d.isApp) {
                    // App 里装不了 Release 的安装包，更新走 App 自己的菜单
                    html += '<br>请到App的菜单中点击「立即更新」来进行更新';
                } else if (d.asset) {
                    html += '<br><a href="/selfUpdate">立即更新并重启</a>';
                } else {
                    html += '<br>没有适合当前设备的更新文件，请手动下载';
                }
                el.innerHTML = html;
            };
            xhr.send();
        }
        // 状态信息
        function getStatus() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/status?t=' + Date.now(), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    var d = JSON.parse(xhr.responseText);
                    // 按运行模式显示按钮：App 下才有亮屏/熄屏/摄像头，Linux 下才有均衡器
                    var appOnly = document.querySelectorAll('.app-only');
                    var linuxOnly = document.querySelectorAll('.linux-only');
                    for (var i = 0; i < appOnly.length; i++) {
                        appOnly[i].style.display = d.isApp ? 'inline-block' : 'none';
                    }
                    for (var j = 0; j < linuxOnly.length; j++) {
                        linuxOnly[j].style.display = d.isApp ? 'none' : 'inline-block';
                    }
                    var msg = (d.batLevel ? '电量 ' + d.batLevel.trim() + '%<br>' : '')
                    + (d.stopUnix ? '将在 ' + new Date(d.stopUnix*1000).toLocaleString('af').split(' ')[1] + ' 后停止<br>' : '')
                    + (d.skipAlarm ? '将跳过 ' + d.skipAlarm + ' 次闹钟<br>' : '')
                    + (d.isStop ? '已停止播放' : d.isPaused ? '已暂停播放' : (d.isAlarm ? '闹钟 ' : '')
                    + (d.playList && d.playList.length > 0 ? '待播放 '+d.playList.length + ' 首 ' : '')
                    + (d.nowId ? '<a href="https://music.163.com/#/song?id=' + d.nowId + '">正在播放</a>' : d.nowUrl ? '<a href="' + d.nowUrl + '">正在播放</a>' : ''));
                    document.getElementById('statusMsg').innerHTML = msg;
                    if (d.version) {
                        document.getElementById('ver').innerHTML = 'v' + d.version;
                    }
                }
            }
            xhr.send();

            var lastPlayUrl = readItem('lastPlayUrl')
            if (lastPlayUrl) {
                document.getElementById('playUrl').value = lastPlayUrl
            }
            var lastPlayList = readItem('lastPlayList')
            if (lastPlayList) {
                document.getElementById('playlistId').value = lastPlayList
            }
            var lastPlayMusic = readItem('lastPlayMusic')
            if (lastPlayMusic) {
                document.getElementById('playmusicId').value = lastPlayMusic
            }
        }
        window.onload = getStatus;
        // window.onfocus = getStatus;
        window.onpageshow = function(event) {
            if (event.persisted || window.performance && window.performance.navigation.type == 2) {
                getStatus();
            }
        }
    </script>
</body>
</html>
