<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的歌单</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .music-shell {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
        gap: 18px;
        min-height: 640px;
      }
      .library-panel,
      .detail-panel {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .detail-panel {
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px #00000014;
      }
      .panel-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .panel-heading h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 1.25em;
        font-weight: 500;
      }
      .account {
        padding: 12px;
        background: #f2f5f7;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .account button {
        margin: 0;
        padding: 6px 10px;
        min-height: 2em;
      }
      .account input {
        width: 100%;
        margin: 8px 0;
        font-family: monospace;
      }
      .account-actions {
        display: flex;
        gap: 6px;
      }
      .account-actions button {
        flex: 1;
      }
      .muted {
        color: #7f8c8d;
        font-size: 0.88em;
      }
      .playlist-list,
      .track-list {
        overflow-y: auto;
        border: 1px solid #777777;
        border-radius: 6px;
      }
      .playlist-list {
        flex: 1;
        max-height: 570px;
      }
      .playlist-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px;
        border: 0;
        border-bottom: 1px solid #edf0f2;
        background: transparent;
        text-align: left;
        cursor: pointer;
        color: #333;
      }
      .playlist-item:hover,
      .playlist-item.active {
        background: #e9f5fd;
      }
      .playlist-item img {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        object-fit: cover;
        border-radius: 5px;
        background: #777777;
      }
      .playlist-meta,
      .track-info {
        min-width: 0;
      }
      .playlist-meta {
        flex: 1;
      }
      .playlist-name,
      .track-name,
      .track-artists,
      .playlist-count {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .playlist-name,
      .track-name {
        font-weight: 500;
        color: #2c3e50;
      }
      .playlist-count,
      .track-artists {
        color: #7f8c8d;
        font-size: 0.88em;
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }
      .detail-cover {
        width: 116px;
        height: 116px;
        object-fit: cover;
        border-radius: 7px;
        background: #777777;
      }
      .detail-title {
        min-width: 0;
        flex: 1;
      }
      .detail-title h1 {
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin: 0 0 6px;
        font-size: 1.7em;
      }
      .detail-title p {
        color: #7f8c8d;
        margin: 0 0 10px;
      }
      .back-button {
        display: none;
        margin: 0 0 12px;
      }
      .track-list {
        flex: 1;
      }
      .track-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid #edf0f2;
      }
      .track-row:hover {
        background: #f7fbfd;
      }
      .track-play {
        margin: 0;
        min-width: 3.6em;
        padding: 5px 8px;
      }
      .track-index {
        width: 2em;
        text-align: right;
        color: #95a5a6;
      }
      .playing-mark {
        width: 1.1em;
        color: #3498db;
        visibility: hidden;
      }
      .track-row.playing .playing-mark {
        visibility: visible;
      }
      .track-info {
        flex: 1;
      }
      .empty-state {
        padding: 35px 18px;
        text-align: center;
        color: #7f8c8d;
      }
      #message {
        white-space: pre-line;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 650px) {
        .main-container {
          padding: 10px;
        }
        .music-shell {
          display: block;
          min-height: 0;
        }
        .library-panel,
        .detail-panel {
          min-height: calc(100vh - 100px);
        }
        .detail-panel {
          padding: 14px;
        }
        .playlist-list,
        .track-list {
          max-height: none;
        }
        .detail-panel.mobile-hidden,
        .library-panel.mobile-hidden {
          display: none;
        }
        .back-button {
          display: inline-block;
        }
        .detail-cover {
          width: 82px;
          height: 82px;
        }
        .detail-title h1 {
          font-size: 1.35em;
        }
      }
      @media (prefers-color-scheme: dark) {
        .account,
        .detail-panel,
        .playlist-list,
        .track-list {
          background: #2c2c2c;
        }
        .account {
          background: #333;
        }
        .playlist-item,
        .track-row {
          color: #777777;
          border-color: #444;
        }
        .playlist-item:hover,
        .playlist-item.active,
        .track-row:hover {
          background: #383838;
        }
        .panel-heading h2,
        .track-name,
        .playlist-name {
          color: #f0f0f0;
        }
      }
      .main-container {
        max-width: none;
        width: 100%;
        min-height: 100vh;
      }
      .music-shell {
        min-height: 0;
      }
      .playlist-list,
      .track-list {
        overflow: visible;
        max-height: none;
      }
      .account {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .account > #accountLabel {
        flex: 1;
      }
      .account > #loginButton {
        margin-left: auto;
      }
      .account > #cookieEditor {
        width: 100%;
      }
      .playlist-item {
        border-radius: 6px;
        margin: 0 0 2px;
        border-bottom: 0;
      }
      .track-id {
        display: block;
        color: #7f8c8d;
        font-size: 0.8em;
      }
      @media (max-width: 650px) {
        .library-panel,
        .detail-panel {
          min-height: 0;
        }
      }
      .main-container {
        max-width: none;
        width: 100%;
        min-height: 100vh;
      }
      .music-shell {
        min-height: 0;
      }
      .playlist-list,
      .track-list {
        overflow: visible;
        max-height: none;
      }
      .track-play {
        display: none;
      }
      .track-row {
        cursor: pointer;
      }
      .track-id {
        display: none;
      }
      .playing-mark {
        width: 0;
        margin-right: -10px;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="music-shell">
        <aside class="library-panel" id="libraryPanel">
          <div class="panel-heading">
            <img src="/favicon.ico" />
            <h2>我的歌单</h2>
            <a href="/">返回</a>
          </div>
          <div id="message" role="status">正在读取播放状态……</div>
          <div class="account">
            <div id="accountLabel">未登录</div>
            <div id="cookieEditor" hidden>
              <input
                id="cookieInput"
                type="password"
                placeholder="粘贴网易云完整 Cookie"
              />
              <div class="account-actions">
                <button type="button" id="saveCookie">保存并登录</button><button type="button" class="red" id="clearCookie">清除</button>
              </div>
              <div class="muted">
                Cookie保存在当前浏览器中<br>
                先登录网页版网易云音乐，按F12打开开发者工具，切换到"网络"标签，刷新页面，点击第一个请求，找到"请求标头"中的"Cookie"，右键"复制值"粘贴到上方输入框
              </div>
            </div>
            <button type="button" id="loginButton">登录</button>
          </div>
          <div class="playlist-list" id="playlistList">
            <div class="empty-state">正在加载歌单……</div>
          </div>
        </aside>
        <main class="detail-panel mobile-hidden" id="detailPanel">
          <button type="button" class="back-button" id="backButton">
            返回歌单
          </button>
          <div id="detailEmpty" class="empty-state">请选择一个歌单</div>
          <div id="detailContent" hidden>
            <div class="detail-header">
              <img class="detail-cover" id="detailCover" alt="" />
              <div class="detail-title">
                <h1 id="detailName"></h1>
                <p id="detailId"></p>
                <p id="detailCount"></p>
                <button type="button" id="playAll">播放全部</button>
              </div>
            </div>
            <div class="track-list" id="trackList"></div>
          </div>
        </main>
      </div>
    </div>
    <script>
      var state = {
        playlists: [],
        currentId: "",
        nowId: "",
        selected: null,
        trackIds: []
      };
      var fullIdsFor = "";

      function $(id) {
        return document.getElementById(id);
      }
      function msg(t, e) {
        $("message").textContent = t;
        $("message").style.color = e ? "#c0392b" : "";
      }
      function decodeCookie(v) {
        try {
          return decodeURIComponent(v);
        } catch (e) {
          return v;
        }
      }
      function cv() {
        var values = document.cookie ? document.cookie.split("; ") : [];
        var prefix = "netease_cookie=";
        var i;
        for (i = 0; i < values.length; i++) {
          if (values[i].indexOf(prefix) === 0) {
            return values[i].substring(prefix.length);
          }
        }
        return "";
      }
      function setcv(v) {
        document.cookie =
          "netease_cookie=" +
          encodeURIComponent(v) +
          "; path=/; max-age=2592000; SameSite=Lax";
      }
      function request(url, done, failed) {
        var xhr;
        var finished = false;
        failed = failed || function () {};
        function fail(error) {
          if (finished) return;
          finished = true;
          failed(error);
        }
        try {
          xhr = window.XMLHttpRequest
            ? new XMLHttpRequest()
            : new ActiveXObject("Microsoft.XMLHTTP");
          xhr.onreadystatechange = function () {
            var status;
            if (xhr.readyState !== 4 || finished) return;
            status = xhr.status === 1223 ? 204 : xhr.status;
            if (status >= 200 && status < 300) {
              finished = true;
              done(xhr.responseText);
            } else {
              fail(new Error("HTTP " + status));
            }
          };
          xhr.onerror = function () {
            fail(new Error("网络请求失败"));
          };
          xhr.open("GET", url, true);
          xhr.send(null);
        } catch (e) {
          fail(e);
        }
      }
      function json(url, done, failed) {
        request(
          url,
          function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              if (failed) failed(e);
              return;
            }
            done(data);
          },
          failed
        );
      }
      function image(i, u) {
        i.onerror = function () {
          i.removeAttribute("src");
        };
        if (u) i.src = u;
      }
      function setHidden(element, hidden) {
        element.hidden = hidden;
        element.style.display = hidden ? "none" : "";
      }
      function addClass(element, name) {
        if ((" " + element.className + " ").indexOf(" " + name + " ") < 0) {
          element.className += (element.className ? " " : "") + name;
        }
      }
      function removeClass(element, name) {
        var classes = element.className.split(" ");
        var kept = [];
        var i;
        for (i = 0; i < classes.length; i++) {
          if (classes[i] && classes[i] !== name) kept.push(classes[i]);
        }
        element.className = kept.join(" ");
      }
      function toggleClass(element, name, enabled) {
        if (enabled) addClass(element, name);
        else removeClass(element, name);
      }
      function account(n) {
        $("accountLabel").textContent = n || "未登录";
        $("loginButton").textContent = n ? "更换 Cookie" : "登录";
      }
      function editor(v) {
        setHidden($("cookieEditor"), !v);
        setHidden($("loginButton"), v);
        if (v) $("cookieInput").focus();
      }
      function isDesktop() {
        if (window.matchMedia) return window.matchMedia("(min-width:651px)").matches;
        return document.documentElement.clientWidth > 650;
      }
      function scrollToTop() {
        if (window.scrollTo) window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      function renderLists() {
        var list = $("playlistList");
        var i;
        var p;
        var b;
        var imageNode;
        var meta;
        var name;
        var count;
        list.textContent = "";
        if (!state.playlists.length) {
          list.innerHTML = '<div class="empty-state">暂无歌单</div>';
          return;
        }
        for (i = 0; i < state.playlists.length; i++) {
          p = state.playlists[i];
          b = document.createElement("button");
          b.type = "button";
          b.className =
            "playlist-item" +
            (String(p.id) === state.currentId ? " active" : "");
          imageNode = document.createElement("img");
          image(imageNode, p.coverImgUrl);
          meta = document.createElement("span");
          meta.className = "playlist-meta";
          name = document.createElement("span");
          name.className = "playlist-name";
          name.textContent = p.name || "未命名歌单";
          count = document.createElement("span");
          count.className = "playlist-count";
          count.textContent = (p.trackCount || 0) + " 首歌曲";
          meta.appendChild(name);
          meta.appendChild(count);
          b.appendChild(imageNode);
          b.appendChild(meta);
          b.onclick = (function (playlist) {
            return function () {
              select(playlist);
            };
          })(p);
          list.appendChild(b);
        }
      }
      function eachTrackRow(callback) {
        var rows = document.querySelectorAll("#trackList .track-row");
        var i;
        for (i = 0; i < rows.length; i++) callback(rows[i], i, rows);
      }
      function updatePlaying(id) {
        state.nowId = String(id);
        eachTrackRow(function (row) {
          toggleClass(row, "playing", row.getAttribute("data-id") === state.nowId);
        });
      }
      function play(ids) {
        if (!ids.length || !state.selected) return;
        updatePlaying(ids[0]);
        request(
          "/playmusiclist?ids=" +
            encodeURIComponent(ids.join(",")) +
            "&id=" +
            encodeURIComponent(state.selected.id),
          function () {
            msg("播放 " + ids.length + " 首歌曲");
          },
          function (e) {
            msg("播放请求失败：" + e.message, true);
          }
        );
      }
      function idsFromTracks(ts, start) {
        var ids = [];
        var i;
        var t;
        for (i = start; i < ts.length; i++) {
          t = ts[i];
          if (t && t.id != null) ids.push(String(t.id));
        }
        return ids;
      }
      function idsFromRows(rows, start) {
        var ids = [];
        var i;
        for (i = start; i < rows.length; i++) {
          ids.push(rows[i].getAttribute("data-id"));
        }
        return ids;
      }
      function tracks(ts) {
        var list = $("trackList");
        var i;
        var t;
        var row;
        var mark;
        var number;
        var info;
        var name;
        var artists;
        var artistNames;
        var j;
        list.textContent = "";
        ts = ts || [];
        for (i = 0; i < ts.length; i++) {
          t = ts[i];
          if (!t || t.id == null) continue;
          row = document.createElement("div");
          row.className =
            "track-row" + (String(t.id) === state.nowId ? " playing" : "");
          row.setAttribute("data-id", t.id);
          row.onclick = (function (index, source) {
            return function () {
              play(idsFromTracks(source, index));
            };
          })(i, ts);
          mark = document.createElement("span");
          mark.className = "playing-mark";
          mark.textContent = "▶";
          number = document.createElement("span");
          number.className = "track-index";
          number.textContent = i + 1;
          info = document.createElement("span");
          info.className = "track-info";
          name = document.createElement("span");
          name.className = "track-name";
          name.textContent = t.name || "未知歌曲";
          artists = document.createElement("span");
          artists.className = "track-artists";
          artistNames = [];
          if (t.ar) {
            for (j = 0; j < t.ar.length; j++) {
              if (t.ar[j] && t.ar[j].name) artistNames.push(t.ar[j].name);
            }
          }
          artists.textContent = artistNames.join(" / ") || "未知歌手";
          info.appendChild(name);
          info.appendChild(artists);
          row.appendChild(mark);
          row.appendChild(number);
          row.appendChild(info);
          list.appendChild(row);
        }
      }
      function showSelectError(e) {
        setHidden($("detailEmpty"), false);
        msg("歌单加载失败：" + e.message, true);
      }
      function select(p, showDetail) {
        var detail;
        var detailTracks;
        if (typeof showDetail === "undefined") showDetail = true;
        scrollToTop();
        state.selected = p;
        state.currentId = String(p.id);
        state.trackIds = [];
        fullIdsFor = "";
        renderLists();
        setHidden($("detailEmpty"), true);
        setHidden($("detailContent"), true);
        $("detailId").textContent = "歌单 ID: " + p.id;
        msg("正在加载歌单……");
        json(
          "/neapi/v6/playlist/detail?n=99999&id=" + encodeURIComponent(p.id),
          function (d) {
            if (d.code !== 200 || !d.playlist) {
              showSelectError(new Error(d.message || "歌单接口返回错误"));
              return;
            }
            detail = d.playlist;
            detailTracks = detail.tracks || [];
            p.name = detail.name || p.name;
            p.coverImgUrl = detail.coverImgUrl || p.coverImgUrl;
            p.trackCount =
              detail.trackCount != null
                ? detail.trackCount
                : detailTracks.length || p.trackCount;
            renderLists();
            image($("detailCover"), detail.coverImgUrl);
            $("detailName").textContent = detail.name || p.name;
            $("detailCount").textContent =
              "共 " + detailTracks.length + " 首歌曲";
            tracks(detailTracks);
            setHidden($("detailContent"), false);
            msg("歌单加载成功");
            if (showDetail) {
              addClass($("libraryPanel"), "mobile-hidden");
              removeClass($("detailPanel"), "mobile-hidden");
            }
          },
          showSelectError
        );
      }
      function loadError(e) {
        account("登录状态读取失败");
        $("playlistList").innerHTML =
          '<div class="empty-state">歌单加载失败</div>';
        msg("网易云接口请求失败：" + e.message, true);
      }
      function load() {
        json(
          "/status?t=" + new Date().getTime(),
          function (s) {
            var userId;
            var user;
            var d;
            var nickname = "";
            var i;
            var p = null;
            state.currentId = s.playListId || "";
            state.nowId = s.nowId || "";
            json(
              "/neapi/user/info",
              function (u) {
                if (
                  u.code === 301 ||
                  !u.userPoint ||
                  !u.userPoint.userId
                ) {
                  account("");
                  if (state.currentId) {
                    // 歌单详情接口无需登录，允许访客查看当前正在播放的歌单
                    state.playlists = [
                      {
                        id: state.currentId,
                        name: "当前播放歌单",
                        trackCount:
                          s.playList && s.playList.length
                            ? s.playList.length
                            : 0
                      }
                    ];
                    renderLists();
                    select(state.playlists[0], isDesktop());
                  } else {
                    state.playlists = [];
                    $("playlistList").innerHTML =
                      '<div class="empty-state">请先登录后加载歌单</div>';
                  }
                  return;
                }
                user = u.userPoint;
                userId = user.userId;
                json(
                  "/neapi/user/playlist?limit=99999&uid=" + userId,
                  function (playlistData) {
                    d = playlistData;
                    state.playlists = d.playlist || [];
                    for (i = 0; i < state.playlists.length; i++) {
                      if (
                        state.playlists[i].creator &&
                        state.playlists[i].creator.nickname
                      ) {
                        nickname = state.playlists[i].creator.nickname;
                        break;
                      }
                    }
                    account(nickname || "用户 " + userId);
                    renderLists();
                    for (i = 0; i < state.playlists.length; i++) {
                      if (
                        String(state.playlists[i].id) === state.currentId
                      ) {
                        p = state.playlists[i];
                        break;
                      }
                    }
                    if (p) select(p, isDesktop());
                    else msg("请选择一个歌单开始播放");
                  },
                  loadError
                );
              },
              loadError
            );
          },
          loadError
        );
      }
      function bindFullTrackClicks() {
        var rows = document.querySelectorAll("#trackList .track-row");
        var i;
        for (i = 0; i < rows.length; i++) {
          rows[i].onclick = (function (index, rowList) {
            return function () {
              play(
                state.trackIds.length
                  ? state.trackIds.slice(index)
                  : idsFromRows(rowList, index)
              );
            };
          })(i, rows);
        }
        $("playAll").onclick = function () {
          var ids = [];
          var currentRows = document.querySelectorAll("#trackList .track-row");
          if (state.trackIds.length) {
            ids = state.trackIds.slice(0);
          } else {
            ids = idsFromRows(currentRows, 0);
          }
          play(ids);
        };
      }
      function loadFullTrackIds() {
        var selectedId;
        if (!state.selected) return;
        selectedId = String(state.selected.id);
        if (fullIdsFor === selectedId) return;
        fullIdsFor = selectedId;
        json(
          "/neapi/v6/playlist/detail?n=99999&id=" +
            encodeURIComponent(selectedId),
          function (data) {
            var rawIds =
              data.playlist && data.playlist.trackIds
                ? data.playlist.trackIds
                : [];
            var ids = [];
            var i;
            var item;
            for (i = 0; i < rawIds.length; i++) {
              item = rawIds[i];
              if (item && item.id != null) ids.push(String(item.id));
              else if (item != null && item !== "") ids.push(String(item));
            }
            if (!state.selected || String(state.selected.id) !== selectedId) {
              return;
            }
            state.trackIds = ids;
            bindFullTrackClicks();
          },
          function () {}
        );
      }

      $("cookieInput").type = "text";
      $("loginButton").onclick = function () {
        var value = cv();
        if (value) $("cookieInput").value = decodeCookie(value);
        editor(true);
      };
      $("saveCookie").onclick = function () {
        var value = $("cookieInput").value.replace(/^\s+|\s+$/g, "");
        if (!value) {
          msg("请输入 Cookie", true);
          return;
        }
        setcv(value);
        editor(false);
        load();
      };
      $("clearCookie").onclick = function () {
        document.cookie = "netease_cookie=; path=/; max-age=0";
        editor(false);
        account("");
        load();
      };
      $("backButton").onclick = function () {
        addClass($("detailPanel"), "mobile-hidden");
        removeClass($("libraryPanel"), "mobile-hidden");
      };
      $("playAll").onclick = function () {
        play(idsFromRows(document.querySelectorAll("#trackList .track-row"), 0));
      };
      if (cv()) $("cookieInput").value = decodeCookie(cv());
      load();
      setInterval(loadFullTrackIds, 300);
    </script>
  </body>
</html>
